services:
  feishu-inventory-bridge:
    image: ${XIANYU_IMAGE:?Set XIANYU_IMAGE to a prebuilt linux/amd64 image}
    pull_policy: ${PULL_POLICY:-missing}
    container_name: xianyu-feishu-bridge
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=1770
    entrypoint: ["python", "/app/feishu_inventory_bridge.py"]
    command: ["--host", "0.0.0.0", "--port", "8765"]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: ${TZ:-Asia/Shanghai}
      FEISHU_AUTH_MODE: bot
      FEISHU_APP_ID: ${FEISHU_APP_ID:?Set FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?Set FEISHU_APP_SECRET}
      FEISHU_BASE_TOKEN: ${FEISHU_BASE_TOKEN:?Set FEISHU_BASE_TOKEN}
      FEISHU_TABLE_ID: ${FEISHU_TABLE_ID:?Set FEISHU_TABLE_ID}
      FEISHU_INVENTORY_CHAT_ID: ${FEISHU_INVENTORY_CHAT_ID:?Set FEISHU_INVENTORY_CHAT_ID}
      FEISHU_INVENTORY_SOURCE_MESSAGE_ID: ${FEISHU_INVENTORY_SOURCE_MESSAGE_ID:?Set FEISHU_INVENTORY_SOURCE_MESSAGE_ID}
      FEISHU_INVENTORY_BRIDGE_TOKEN: ${FEISHU_INVENTORY_BRIDGE_TOKEN:?Set FEISHU_INVENTORY_BRIDGE_TOKEN}
      FEISHU_REQUEST_TIMEOUT: ${FEISHU_REQUEST_TIMEOUT:-20}
      FEISHU_MAX_MEDIA_BYTES: ${FEISHU_MAX_MEDIA_BYTES:-52428800}
    volumes:
      - ./logs:/app/logs:rw
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: ${BRIDGE_MEMORY_LIMIT:-256m}
    cpus: ${BRIDGE_CPU_LIMIT:-0.50}
    security_opt:
      - no-new-privileges:true

  xianyu-app:
    image: ${XIANYU_IMAGE:?Set XIANYU_IMAGE to a prebuilt linux/amd64 image}
    pull_policy: ${PULL_POLICY:-missing}
    container_name: xianyu-auto-reply
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    pids_limit: ${APP_PIDS_LIMIT:-256}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=1770
      - /home/app/.cache:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700
    depends_on:
      feishu-inventory-bridge:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./backups:/app/backups:rw
      - ./uploads/images:/app/static/uploads/images:rw
      - ./global_config.yml:/app/global_config.yml:ro
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: ${TZ:-Asia/Shanghai}
      DB_PATH: &production_db_path /app/data/xianyu_data.db
      AI_CACHE_DIR: /app/data
      LOG_FILE_PATH: /app/logs/realtime.log
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      TOKEN_EXPIRE_TIME: ${TOKEN_EXPIRE_TIME:-86400}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-300}
      CAPTCHA_GRANT_TTL: ${CAPTCHA_GRANT_TTL:-300}
      ITEM_SEARCH_RATE_LIMIT: ${ITEM_SEARCH_RATE_LIMIT:-6}
      ITEM_SEARCH_RATE_WINDOW: ${ITEM_SEARCH_RATE_WINDOW:-60}
      ITEM_SEARCH_MAX_CONCURRENCY: ${ITEM_SEARCH_MAX_CONCURRENCY:-1}
      XIANYU_MESSAGE_API_KEY: ${XIANYU_MESSAGE_API_KEY:?Set XIANYU_MESSAGE_API_KEY to at least 32 random bytes}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      QWEN_API_BASE_URL: ${QWEN_API_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VL_MODEL: ${QWEN_VL_MODEL:-qwen-vl-plus}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen-plus}
      QWEN_REQUEST_TIMEOUT: ${QWEN_REQUEST_TIMEOUT:-60}
      QWEN_MAX_RETRIES: ${QWEN_MAX_RETRIES:-1}
      QWEN_MAX_IMAGE_BYTES: ${QWEN_MAX_IMAGE_BYTES:-3145728}
      QWEN_MAX_IMAGE_DIMENSION: ${QWEN_MAX_IMAGE_DIMENSION:-1600}
      QWEN_MAX_PRODUCT_IMAGES: ${QWEN_MAX_PRODUCT_IMAGES:-4}
      FEISHU_AUTH_MODE: bot
      FEISHU_BASE_TOKEN: ${FEISHU_BASE_TOKEN:?Set FEISHU_BASE_TOKEN}
      FEISHU_TABLE_ID: ${FEISHU_TABLE_ID:?Set FEISHU_TABLE_ID}
      FEISHU_INVENTORY_BRIDGE_URL: http://feishu-inventory-bridge:8765
      FEISHU_INVENTORY_BRIDGE_TOKEN: ${FEISHU_INVENTORY_BRIDGE_TOKEN:?Set FEISHU_INVENTORY_BRIDGE_TOKEN}
      COOKIE_CLOUD_HOST: ${COOKIE_CLOUD_HOST:-}
      COOKIE_CLOUD_UUID: ${COOKIE_CLOUD_UUID:-}
      COOKIE_CLOUD_PASSWORD: ${COOKIE_CLOUD_PASSWORD:-}
      COOKIE_CLOUD_REFRESH_SECONDS: ${COOKIE_CLOUD_REFRESH_SECONDS:-1800}
      COOKIE_CLOUD_COOKIE_ID: ${COOKIE_CLOUD_COOKIE_ID:-default}
      DOCKER_ENV: "true"
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: ${MEMORY_LIMIT:-1536m}
    cpus: ${CPU_LIMIT:-1.50}
    security_opt:
      - no-new-privileges:true

  maintenance:
    image: ${XIANYU_IMAGE:?Set XIANYU_IMAGE to a prebuilt linux/amd64 image}
    pull_policy: ${PULL_POLICY:-missing}
    container_name: xianyu-maintenance
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=1770
    entrypoint: ["python", "/app/production_maintenance.py"]
    command: ["run"]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: ${TZ:-Asia/Shanghai}
      DB_PATH: *production_db_path
      UPLOAD_DIR: /app/static/uploads/images
      BACKUP_DIR: /app/backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_INTERVAL_SECONDS: ${BACKUP_RETRY_INTERVAL_SECONDS:-60}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HEALTH_GRACE_SECONDS: ${BACKUP_HEALTH_GRACE_SECONDS:-900}
      BACKUP_FAILURE_THRESHOLD: ${BACKUP_FAILURE_THRESHOLD:-3}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-4294967296}
      DISK_CHECK_INTERVAL_SECONDS: ${DISK_CHECK_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data:/app/data:ro
      - ./uploads/images:/app/static/uploads/images:ro
      - ./backups:/app/backups:rw
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "python", "/app/production_maintenance.py", "health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: ${BACKUP_HEALTH_GRACE_SECONDS:-900}s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  cookiecloud:
    image: easychen/cookiecloud:latest
    pull_policy: missing
    container_name: xianyu-cookiecloud
    restart: unless-stopped
    profiles: ["cookiecloud"]
    ports:
      - "${COOKIECLOUD_BIND_ADDRESS:-127.0.0.1}:8088:8088"
    networks:
      - xianyu-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    pull_policy: missing
    container_name: xianyu-nginx
    restart: unless-stopped
    profiles: ["nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - xianyu-app
    networks:
      - xianyu-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

networks:
  xianyu-network:
    driver: bridge

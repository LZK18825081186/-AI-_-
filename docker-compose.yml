services:
  xianyu-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xianyu-auto-reply:latest
    container_name: xianyu-auto-reply
    restart: unless-stopped
    # 使用root用户避免权限问题
    user: "0:0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # 数据持久化
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./global_config.yml:/app/global_config.yml:ro
      # 可选：如果需要自定义配置
      # - ./custom_config.yml:/app/global_config.yml:ro
      # 可选：备份目录
      - ./backups:/app/backups:rw
    environment:
      # 运行时基础配置
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=${TZ:-Asia/Shanghai}
      # 数据库路径
      - DB_PATH=${DB_PATH:-/app/data/xianyu_data.db}
      # 管理后台（通过 .env 修改）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - TOKEN_EXPIRE_TIME=${TOKEN_EXPIRE_TIME:-86400}
      # DeepSeek API
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # 远程图片理解模型（可选）
      - LM_STUDIO_URL=${LM_STUDIO_URL:-}
      # 飞书多维表格库存
      - FEISHU_BASE_TOKEN=${FEISHU_BASE_TOKEN:-}
      - FEISHU_TABLE_ID=${FEISHU_TABLE_ID:-}
      # CookieCloud（浏览器插件自动同步Cookie）
      - COOKIE_CLOUD_HOST=${COOKIE_CLOUD_HOST:-http://cookiecloud:8088}
      - COOKIE_CLOUD_UUID=${COOKIE_CLOUD_UUID:-}
      - COOKIE_CLOUD_PASSWORD=${COOKIE_CLOUD_PASSWORD:-}
      - COOKIE_CLOUD_REFRESH_SECONDS=${COOKIE_CLOUD_REFRESH_SECONDS:-1800}
      - COOKIE_CLOUD_COOKIE_ID=${COOKIE_CLOUD_COOKIE_ID:-default}
      # Docker 运行环境标志
      - DOCKER_ENV=true

    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1}G
          cpus: '${CPU_LIMIT:-1.0}'
        reservations:
          memory: ${MEMORY_RESERVATION:-512}M
          cpus: '${CPU_RESERVATION:-0.5}'

  # 内置 CookieCloud 服务（同步浏览器闲鱼 Cookie）
  cookiecloud:
    image: easychen/cookiecloud:latest
    container_name: xianyu-cookiecloud
    restart: unless-stopped
    ports:
      - "8088:8088"
    networks:
      - xianyu-network

  # 可选：添加Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: xianyu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - xianyu-app
    networks:
      - xianyu-network
    profiles:
      - with-nginx

networks:
  xianyu-network:
    driver: bridge

volumes:
  xianyu-data:
    driver: local
  xianyu-logs:
    driver: local

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 闲鱼自动回复管理系统</title>
  <link rel="stylesheet" href="/static/lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/lib/bootstrap-icons/bootstrap-icons.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

    * { box-sizing: border-box; }

    :root {
      --bg-deepest: #06081a;
      --bg-surface: #0f1535;
      --bg-card: rgba(15, 21, 53, 0.55);
      --accent: #00d4ff;
      --accent-end: #0078a8;
      --accent-glow: rgba(0, 212, 255, 0.25);
      --accent-glow-strong: rgba(0, 212, 255, 0.45);
      --border-subtle: rgba(0, 212, 255, 0.06);
      --border-glow: rgba(0, 212, 255, 0.18);
      --text-primary: #e8ecf8;
      --text-secondary: rgba(200, 210, 235, 0.55);
      --text-muted: rgba(200, 210, 235, 0.32);
      --danger: #f87171;
      --success: #2dd4bf;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deepest);
      background-image:
        radial-gradient(ellipse at 30% 40%, rgba(0, 212, 255, 0.06) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 60%, rgba(99, 102, 241, 0.07) 0%, transparent 50%),
        linear-gradient(rgba(0, 212, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* ❖ HUD 角落十字标记 ❖ */
    body::before {
      content: '';
      position: fixed;
      inset: 20px;
      pointer-events: none;
      z-index: 0;
      border-top: 1px solid rgba(0, 212, 255, 0.08);
      border-bottom: 1px solid rgba(0, 212, 255, 0.08);
    }

    /* ── 登录卡片 — 玻璃拟态 ── */
    .login-container {
      width: 100%;
      max-width: 430px;
      background: var(--bg-card);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow:
        0 32px 100px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(0, 212, 255, 0.04);
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.5s var(--ease-spring);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 顶部发光条 */
    .login-container::before {
      content: '';
      position: absolute;
      top: 0; left: 5%; right: 5%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent, rgba(0, 212, 255, 0.2), transparent);
      z-index: 2;
    }

    /* ── 头部 — 品牌标识 ── */
    .login-header {
      padding: 2.25rem 2rem 1.75rem;
      text-align: center;
      background: linear-gradient(180deg, rgba(0, 212, 255, 0.06), transparent);
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .login-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent, rgba(0, 212, 255, 0.2), transparent);
    }

    .login-header .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-end));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      margin-bottom: 0.85rem;
      box-shadow: 0 0 28px var(--accent-glow-strong), inset 0 1px 0 rgba(255,255,255,0.2);
      position: relative;
    }

    .login-header .brand-icon::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 17px;
      border: 1px solid rgba(0, 212, 255, 0.25);
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }

    .login-header h2 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .login-header p {
      margin: 0.2rem 0 0;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      letter-spacing: 0.04em;
    }

    /* ── 登录体 ── */
    .login-body {
      padding: 1.75rem 2rem 2.25rem;
    }

    /* ── 登录方式 Tab ── */
    .login-tabs .btn-group {
      display: flex;
      gap: 3px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
      padding: 3px;
      border: 1px solid var(--border-subtle);
    }

    .login-tabs .btn {
      flex: 1;
      border: none;
      border-radius: 8px !important;
      padding: 0.5rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      transition: all 0.2s var(--ease-spring);
      letter-spacing: 0.02em;
    }

    .login-tabs .btn-check:checked + .btn {
      background: rgba(0, 212, 255, 0.1);
      color: var(--accent);
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.12);
    }

    /* ── 输入框 ── */
    .input-group {
      position: relative;
      margin-bottom: 0.85rem;
    }

    .input-group i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      z-index: 10;
      font-size: 0.88rem;
      transition: color 0.2s ease;
    }

    .input-group:focus-within i {
      color: var(--accent);
    }

    .input-group .form-control {
      padding-left: 38px;
    }

    .form-control {
      background: rgba(5, 8, 22, 0.55);
      border: 1px solid rgba(0, 212, 255, 0.08);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.84rem;
      font-family: inherit;
      color: var(--text-primary);
      width: 100%;
      transition: all 0.22s var(--ease-spring);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.3),
        0 0 0 3px rgba(0, 212, 255, 0.08),
        0 0 16px rgba(0, 212, 255, 0.06);
    }

    .form-control::placeholder {
      color: rgba(200, 210, 235, 0.22);
    }

    /* ── 登录按钮 ── */
    .btn-login {
      background: linear-gradient(135deg, var(--accent), var(--accent-end));
      border: none;
      border-radius: 10px;
      padding: 0.72rem;
      font-size: 0.9rem;
      font-weight: 700;
      width: 100%;
      color: #fff;
      cursor: pointer;
      transition: all 0.25s var(--ease-spring);
      box-shadow: 0 4px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.15);
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      box-shadow: 0 6px 32px var(--accent-glow-strong), inset 0 1px 0 rgba(255,255,255,0.2);
      transform: translateY(-1px) scale(1.01);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }

    .btn-login:hover::after {
      left: 100%;
    }

    /* ── 错误提示 ── */
    .alert {
      border-radius: 8px;
      font-size: 0.8rem;
      border: 1px solid transparent;
      padding: 0.6rem 0.85rem;
      margin-bottom: 0.75rem;
    }

    .alert-danger {
      background: rgba(248, 113, 113, 0.08);
      border-color: rgba(248, 113, 113, 0.15);
      color: var(--danger);
    }

    /* ── 表单辅助文字 ── */
    .form-text, #captchaStatus, #codeStatus {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* ── 默认登录信息 ── */
    #defaultLoginInfo {
      background: rgba(15, 21, 53, 0.3) !important;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.75rem 1rem !important;
      margin-top: 1.25rem !important;
    }

    #defaultLoginInfo code {
      background: rgba(0, 212, 255, 0.06) !important;
      border: 1px solid rgba(0, 212, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    /* ── 注册链接 ── */
    #registerSection a {
      color: var(--accent);
      font-weight: 500;
    }

    #registerSection a:hover {
      color: #67e8f9;
    }

    /* ── 验证码 ── */
    .captcha-container img {
      border-color: rgba(0, 212, 255, 0.1) !important;
      border-radius: 8px;
    }

    .btn-outline-secondary {
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      background: var(--bg-card);
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-outline-secondary:hover {
      border-color: var(--border-glow);
      background: rgba(0, 212, 255, 0.06);
      color: var(--text-primary);
    }

    .btn-outline-primary {
      border: 1px solid var(--border-glow);
      color: var(--accent);
      background: transparent;
      border-radius: 8px;
      font-weight: 500;
    }

    .btn-outline-primary:hover {
      background: rgba(0, 212, 255, 0.08);
      color: #67e8f9;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ── 加载图标 ── */
    .spinner-border {
      border-color: rgba(255,255,255,0.2);
      border-right-color: var(--accent);
    }

    /* ── 响应式 ── */
    @media (max-width: 480px) {
      .login-container { max-width: 95%; border-radius: 16px; }
      .login-header { padding: 1.5rem 1.25rem 1.25rem; }
      .login-body { padding: 1.25rem 1.25rem 1.5rem; }
      .login-tabs .btn { font-size: 0.68rem; padding: 0.45rem 0.4rem; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="brand-icon"><i class="bi bi-chat-dots-fill"></i></div>
      <h2>闲鱼自动回复</h2>
      <p>管理系统登录</p>
    </div>
    
    <div class="login-body">
      <!-- 登录方式选择 -->
      <div class="login-tabs mb-4">
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="loginType" id="usernameLogin" value="username" checked>
          <label class="btn btn-outline-primary" for="usernameLogin">用户名/密码</label>

          <input type="radio" class="btn-check" name="loginType" id="emailPasswordLogin" value="email-password">
          <label class="btn btn-outline-primary" for="emailPasswordLogin">邮箱/密码</label>

          <input type="radio" class="btn-check" name="loginType" id="emailCodeLogin" value="email-code">
          <label class="btn btn-outline-primary" for="emailCodeLogin">邮箱/验证码</label>
        </div>
      </div>

      <form id="loginForm">
        <!-- 用户名/密码登录 -->
        <div id="usernameLoginForm" class="login-form-section">
          <div class="input-group">
            <i class="bi bi-person-fill"></i>
            <input type="text" class="form-control" id="username" placeholder="请输入用户名">
          </div>

          <div class="input-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control" id="password" placeholder="请输入密码">
          </div>
        </div>

        <!-- 邮箱/密码登录 -->
        <div id="emailPasswordLoginForm" class="login-form-section" style="display: none;">
          <div class="input-group">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="form-control" id="emailForPassword" placeholder="请输入邮箱地址">
          </div>

          <div class="input-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control" id="emailPassword" placeholder="请输入密码">
          </div>
        </div>

        <!-- 邮箱/验证码登录 -->
        <div id="emailCodeLoginForm" class="login-form-section" style="display: none;">
          <div class="input-group">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="form-control" id="emailForCode" placeholder="请输入邮箱地址">
          </div>

          <!-- 图形验证码 -->
          <div class="mb-3">
            <label class="form-label">图形验证码</label>
            <div class="row g-2">
              <div class="col-7">
                <input type="text" class="form-control" id="captchaCode" placeholder="输入4位验证码" maxlength="4">
              </div>
              <div class="col-5">
                <div class="captcha-container" style="position: relative;">
                  <img id="captchaImage" src="" alt="图形验证码"
                       style="width: 100%; height: 38px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer;"
                       onclick="refreshCaptcha()">
                  <div id="captchaLoading" class="text-center" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                    <div class="spinner-border spinner-border-sm" role="status"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="form-text">
              <span id="captchaStatus">请输入图形验证码，点击图片可刷新</span>
            </div>
          </div>

          <!-- 邮箱验证码 -->
          <div class="input-group">
            <input type="text" class="form-control" id="verificationCode" placeholder="输入6位验证码" maxlength="6">
            <button type="button" class="btn btn-outline-secondary" id="sendCodeBtn" onclick="sendVerificationCode()" disabled>
              发送验证码
            </button>
          </div>
          <div class="form-text mb-3">
            <span id="codeStatus">请先验证图形验证码</span>
          </div>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <span id="errorMessage"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-login">
          <span class="loading spinner-border spinner-border-sm me-2" role="status"></span>
          <span id="loginText">登录</span>
        </button>
      </form>

      <!-- 注册链接 -->
      <div id="registerSection" class="text-center mt-3">
        <span class="text-muted">还没有账号？</span>
        <a href="/register.html" class="text-decoration-none">
          <i class="bi bi-person-plus me-1"></i>立即注册
        </a>
      </div>

      <!-- 默认账号提示 -->
      <div id="defaultLoginInfo" class="mt-4 p-3 bg-light rounded-3">
        <div class="text-center">
          <small class="text-muted">
            <i class="bi bi-info-circle me-1"></i>
            默认登录账号
          </small>
        </div>
        <div class="mt-2">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <small class="text-muted">用户名：</small>
            <code class="bg-white px-2 py-1 rounded">admin</code>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted">密码：</small>
            <code class="bg-white px-2 py-1 rounded">admin123</code>
          </div>
        </div>
        <div class="text-center mt-2">
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillDefaultCredentials()">
            <i class="bi bi-arrow-down-circle me-1"></i>
            使用默认账号
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const loading = document.querySelector('.loading');
    const loginText = document.getElementById('loginText');
    
    function showError(message) {
      errorMessage.textContent = message;
      errorAlert.classList.remove('d-none');
    }
    
    function hideError() {
      errorAlert.classList.add('d-none');
    }
    
    function setLoading(isLoading) {
      if (isLoading) {
        loading.classList.add('show');
        loginText.textContent = '登录中...';
        loginForm.querySelector('button').disabled = true;
      } else {
        loading.classList.remove('show');
        loginText.textContent = '登录';
        loginForm.querySelector('button').disabled = false;
      }
    }

    // 填充默认登录凭据
    function fillDefaultCredentials() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      hideError();

      // 添加一个小动画效果
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      usernameInput.style.borderColor = 'var(--accent)';
      passwordInput.style.borderColor = 'var(--accent)';
      usernameInput.style.boxShadow = '0 0 12px var(--accent-glow)';
      passwordInput.style.boxShadow = '0 0 12px var(--accent-glow)';

      setTimeout(() => {
        usernameInput.style.borderColor = '';
        passwordInput.style.borderColor = '';
        usernameInput.style.boxShadow = '';
        passwordInput.style.boxShadow = '';
      }, 1000);
    }
    
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      setLoading(true);

      const loginType = document.querySelector('input[name="loginType"]:checked').value;
      let loginData = {};

      try {
        if (loginType === 'username') {
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;

          if (!username || !password) {
            showError('请输入用户名和密码');
            return;
          }

          loginData = { username, password };
        } else if (loginType === 'email-password') {
          const email = document.getElementById('emailForPassword').value;
          const password = document.getElementById('emailPassword').value;

          if (!email || !password) {
            showError('请输入邮箱和密码');
            return;
          }

          if (!validateEmail(email)) {
            showError('请输入有效的邮箱地址');
            return;
          }

          loginData = { email, password };
        } else if (loginType === 'email-code') {
          const email = document.getElementById('emailForCode').value;
          const verificationCode = document.getElementById('verificationCode').value;

          if (!captchaVerified) {
            showError('请先验证图形验证码');
            return;
          }

          if (!email) {
            showError('请输入邮箱地址');
            return;
          }

          if (!validateEmail(email)) {
            showError('请输入有效的邮箱地址');
            return;
          }

          if (!verificationCode || verificationCode.length !== 6) {
            showError('请输入6位验证码');
            return;
          }

          loginData = { email, verification_code: verificationCode };
        }

        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(loginData)
        });

        const result = await response.json();

        if (result.success) {
          // 保存token到localStorage
          localStorage.setItem('auth_token', result.token);

          // 保存用户信息到localStorage
          const userInfo = {
            user_id: result.user_id,
            username: result.username,
            is_admin: result.is_admin
          };
          localStorage.setItem('user_info', JSON.stringify(userInfo));

          // 检查是否有重定向URL
          const redirectUrl = localStorage.getItem('redirectAfterLogin');
          if (redirectUrl) {
            // 清除重定向URL
            localStorage.removeItem('redirectAfterLogin');
            // 跳转到原来的页面
            window.location.href = redirectUrl;
          } else {
            // 默认跳转到管理页面
            window.location.href = '/admin';
          }
        } else {
          showError(result.message);
        }
      } catch (error) {
        showError('登录失败，请检查网络连接');
      } finally {
        setLoading(false);
      }
    });
    
    // 检查是否已经登录
    const token = localStorage.getItem('auth_token');
    if (token) {
      // 验证token是否有效
      fetch('/verify', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      })
      .then(response => response.json())
      .then(result => {
        if (result.authenticated) {
          window.location.href = '/admin';
        }
      })
      .catch(() => {
        // token无效，清除
        localStorage.removeItem('auth_token');
      });
    }

    // 登录方式切换相关变量
    let captchaVerified = false;
    let countdownTimer = null;
    let countdownSeconds = 0;
    let sessionId = generateSessionId();

    // 生成会话ID
    function generateSessionId() {
      return 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
    }

    // 登录方式切换
    function switchLoginType() {
      const loginType = document.querySelector('input[name="loginType"]:checked').value;

      // 隐藏所有表单
      document.querySelectorAll('.login-form-section').forEach(section => {
        section.style.display = 'none';
      });

      // 显示对应表单
      if (loginType === 'username') {
        document.getElementById('usernameLoginForm').style.display = 'block';
      } else if (loginType === 'email-password') {
        document.getElementById('emailPasswordLoginForm').style.display = 'block';
      } else if (loginType === 'email-code') {
        document.getElementById('emailCodeLoginForm').style.display = 'block';
        // 每次切换到邮箱验证码登录时都加载验证码
        loadCaptcha();
      }

      hideError();
    }

    // 加载图形验证码
    async function loadCaptcha() {
      const captchaImage = document.getElementById('captchaImage');
      const captchaLoading = document.getElementById('captchaLoading');
      const captchaStatus = document.getElementById('captchaStatus');

      captchaLoading.style.display = 'block';
      captchaImage.style.display = 'none';

      try {
        const response = await fetch('/generate-captcha', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ session_id: sessionId })
        });

        const result = await response.json();

        if (result.success) {
          captchaImage.src = result.captcha_image;
          captchaStatus.textContent = '请输入图形验证码，点击图片可刷新';
          captchaVerified = false;
          updateSendCodeButton();
        } else {
          captchaStatus.textContent = '图形验证码加载失败，请刷新页面重试';
        }
      } catch (error) {
        console.error('加载图形验证码失败:', error);
        captchaStatus.textContent = '图形验证码加载失败，请检查网络连接';
      } finally {
        captchaLoading.style.display = 'none';
        captchaImage.style.display = 'block';
      }
    }

    // 刷新图形验证码
    function refreshCaptcha() {
      loadCaptcha();
    }

    // 验证图形验证码
    async function verifyCaptcha() {
      const captchaCode = document.getElementById('captchaCode').value.trim();
      const captchaStatus = document.getElementById('captchaStatus');

      if (!captchaCode) {
        captchaStatus.textContent = '请输入图形验证码';
        captchaVerified = false;
        updateSendCodeButton();
        return;
      }

      try {
        const response = await fetch('/verify-captcha', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            session_id: sessionId,
            captcha_code: captchaCode
          })
        });

        const result = await response.json();

        if (result.success) {
          captchaStatus.innerHTML = '<span style="color: #2dd4bf;">✓ 图形验证码验证成功</span>';
          captchaVerified = true;
        } else {
          captchaStatus.innerHTML = '<span style="color: #f87171;">✗ 图形验证码错误，请重新输入</span>';
          captchaVerified = false;
          refreshCaptcha(); // 自动刷新验证码
        }

        updateSendCodeButton();

      } catch (error) {
        console.error('验证图形验证码失败:', error);
        captchaStatus.innerHTML = '<span style="color: #f87171;">验证失败，请检查网络连接</span>';
        captchaVerified = false;
        updateSendCodeButton();
      }
    }

    // 更新发送验证码按钮状态
    function updateSendCodeButton() {
      const sendCodeBtn = document.getElementById('sendCodeBtn');
      const email = document.getElementById('emailForCode').value.trim();
      const codeStatus = document.getElementById('codeStatus');

      if (captchaVerified && email && validateEmail(email)) {
        sendCodeBtn.disabled = false;
        codeStatus.textContent = '图形验证码已验证，可以发送邮箱验证码';
      } else {
        sendCodeBtn.disabled = true;
        if (!captchaVerified) {
          codeStatus.textContent = '请先验证图形验证码';
        } else if (!email) {
          codeStatus.textContent = '请先输入邮箱地址';
        } else if (!validateEmail(email)) {
          codeStatus.textContent = '请输入有效的邮箱地址';
        }
      }
    }

    // 邮箱格式验证
    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    // 开始倒计时
    function startCountdown() {
      countdownSeconds = 60;
      const sendCodeBtn = document.getElementById('sendCodeBtn');
      const codeStatus = document.getElementById('codeStatus');

      sendCodeBtn.disabled = true;

      countdownTimer = setInterval(() => {
        countdownSeconds--;
        sendCodeBtn.textContent = `重新发送 (${countdownSeconds}s)`;
        codeStatus.innerHTML = `<span class="countdown">验证码已发送，${countdownSeconds}秒后可重新发送</span>`;

        if (countdownSeconds <= 0) {
          clearInterval(countdownTimer);
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '发送验证码';
          codeStatus.textContent = '可以重新发送验证码';
        }
      }, 1000);
    }

    // 发送邮箱验证码
    async function sendVerificationCode() {
      const email = document.getElementById('emailForCode').value.trim();

      if (!captchaVerified) {
        showError('请先验证图形验证码');
        return;
      }

      if (!email) {
        showError('请先输入邮箱地址');
        return;
      }

      if (!validateEmail(email)) {
        showError('请输入有效的邮箱地址');
        return;
      }

      try {
        const response = await fetch('/send-verification-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            type: 'login',
            session_id: sessionId
          })
        });

        const result = await response.json();

        if (result.success) {
          startCountdown();
        } else {
          showError(result.message);
        }
      } catch (error) {
        console.error('发送验证码失败:', error);
        showError('发送验证码失败，请检查网络连接');
      }
    }

    // 检查注册状态
    async function checkRegistrationStatus() {
      try {
        const response = await fetch('/registration-status');
        if (response.ok) {
          const data = await response.json();
          const registerSection = document.getElementById('registerSection');
          if (registerSection) {
            registerSection.style.display = data.enabled ? 'block' : 'none';
          }
        }
      } catch (error) {
        console.error('检查注册状态失败:', error);
        // 出错时默认显示注册链接
      }
    }

    // 检查默认登录信息显示状态
    async function checkLoginInfoStatus() {
      try {
        const response = await fetch('/login-info-status');
        const result = await response.json();

        const defaultLoginInfo = document.getElementById('defaultLoginInfo');
        if (result.enabled) {
          defaultLoginInfo.style.display = 'block';
        } else {
          defaultLoginInfo.style.display = 'none';
        }
      } catch (error) {
        console.error('检查登录信息显示状态失败:', error);
        // 出错时默认显示
        document.getElementById('defaultLoginInfo').style.display = 'block';
      }
    }

    // 事件监听器
    document.addEventListener('DOMContentLoaded', function() {
      // 检查注册状态
      checkRegistrationStatus();

      // 检查默认登录信息显示状态
      checkLoginInfoStatus();

      // 登录方式切换
      document.querySelectorAll('input[name="loginType"]').forEach(radio => {
        radio.addEventListener('change', switchLoginType);
      });

      // 图形验证码输入框事件
      const captchaCodeInput = document.getElementById('captchaCode');
      if (captchaCodeInput) {
        captchaCodeInput.addEventListener('input', function() {
          if (this.value.length === 4) {
            verifyCaptcha();
          } else {
            captchaVerified = false;
            updateSendCodeButton();
            document.getElementById('captchaStatus').textContent = '请输入4位图形验证码';
          }
        });
      }

      // 邮箱输入框事件
      const emailForCodeInput = document.getElementById('emailForCode');
      if (emailForCodeInput) {
        emailForCodeInput.addEventListener('input', updateSendCodeButton);
      }
    });
  </script>
</body>
</html>
